name: t11-mcp-auth

services:
  userservice:
    image: khshanovskyi/mockuserservice:latest
    ports:
      - "127.0.0.1:8042:8000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-t11-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}"
      KC_HOSTNAME: "${KEYCLOAK_URL:-http://127.0.0.1:8089}"
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./keycloak/runtime/mcp-realm.json:/opt/keycloak/data/import/mcp-realm.json:ro
      - t11_keycloak_data:/opt/keycloak/data

volumes:
  t11_keycloak_data:

