services:
  userservice:
    image: docker.io/khshanovskyi/mockuserservice:latest
    ports:
      - "127.0.0.1:8041:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GENERATE_USERS=false
      - USER_COUNT=0
    volumes:
      - ./data-t10:/app/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ddg-mcp-server:
    depends_on:
      - userservice
    image: docker.io/khshanovskyi/ddg-mcp-server:latest
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - MCP_TRANSPORT=streamable-http