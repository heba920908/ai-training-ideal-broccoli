services:
  userservice:
    image: docker.io/khshanovskyi/mockuserservice:latest
    ports:
      - "127.0.0.1:8041:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      GENERATE_USERS: "true"
      USERS_NUMBER: "24"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ddg-mcp-server:
    image: docker.io/khshanovskyi/ddg-mcp-server:latest
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - MCP_TRANSPORT=streamable-http