services:
  userservice:
    image: docker.io/khshanovskyi/mockuserservice:latest
    ports:
      - "127.0.0.1:8041:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      GENERATE_USERS: "true"
      USERS_NUMBER: "24"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s